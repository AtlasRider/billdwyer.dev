<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>resume.md — Bill Dwyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:      #1e1e1e;
  --panel:   #252526;
  --border:  #3a3a3a;
  --text:    #d4d4d4;
  --muted:   #6a7178;
  --accent:  #4fc1ff;
  --accent-ink: #0a0a0a;
  --punct:   #808080;
  --bold:    #dcdcaa;
  --italic:  #c586c0;
  --linktext:#ce9178;
  --linkurl: #6a9955;
  --heading: #4ec9b0;
  --toolbar-btn: #333;
  --hover-tint: rgba(255,255,255,.04);
  --card-shadow: rgba(0,0,0,.5);
  --error: #f48771;
  --shell-bg: #141414;
  --prev-bg:      #1b1a17;
  --prev-text:    #e9e6df;
  --prev-heading: #f0ece3;
  --prev-muted:   #9c9890;
  --prev-rule:    #3a372f;
  --prev-link:    #f0ece3;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:      #ffffff;
    --panel:   #f3f3f3;
    --border:  #d4d4d4;
    --text:    #1e1e1e;
    --muted:   #6e6e6e;
    --accent:  #0451a5;
    --accent-ink: #ffffff;
    --punct:   #999999;
    --bold:    #795e26;
    --italic:  #af00db;
    --linktext:#001080;
    --linkurl: #098658;
    --heading: #267f99;
    --toolbar-btn: #e5e5e5;
    --hover-tint: rgba(0,0,0,.035);
    --card-shadow: rgba(0,0,0,.15);
    --error: #cd3131;
    --shell-bg: #e9e9e9;
    --prev-bg:      #fbfaf8;
    --prev-text:    #1f1f1f;
    --prev-heading: #1a1a1a;
    --prev-muted:   #5a5a5a;
    --prev-rule:    #d8d5cf;
    --prev-link:    #1a1a1a;
  }
}

html{background:var(--shell-bg)}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;
  font-size:13.5px;
  line-height:1.6;
  min-height:100vh;
}

.wrap{
  max-width:880px;
  margin:0 auto;
  padding:56px 20px 90px;
}

.editor{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 20px 60px var(--card-shadow);
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.view-toggle{
  display:flex;
  background:var(--toolbar-btn);
  border:1px solid var(--border);
  border-radius:5px;
  overflow:hidden;
}
.view-toggle button{
  font:inherit;
  font-size:12px;
  color:var(--muted);
  background:transparent;
  border:none;
  padding:6px 14px;
  cursor:pointer;
}
.view-toggle button:hover{ color:var(--text); }
.view-toggle button.active{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
.view-toggle button + button{ border-left:1px solid var(--border); }

.toolbar a.raw-link{
  font-size:12px;
  color:var(--muted);
  text-decoration:none;
  border-bottom:1px solid transparent;
}
.toolbar a.raw-link:hover{ color:var(--accent); border-color:var(--accent); }

.pane{ display:none; }
.pane.active{ display:block; }

/* ── Source pane ─────────────────────────────────────── */
#sourcePane{
  padding:14px 0 22px;
  overflow-x:auto;
}
.src-line{
  display:flex;
  padding:0 16px;
}
.src-line:hover{ background:var(--hover-tint); }
.ln{
  flex-shrink:0;
  width:34px;
  text-align:right;
  padding-right:14px;
  color:var(--muted);
  user-select:none;
}
.content{ white-space:pre-wrap; word-break:break-word; }
.md-punct{ color:var(--punct); }
.md-bold{ color:var(--bold); font-weight:700; }
.md-italic{ color:var(--italic); font-style:italic; }
.md-linktext{ color:var(--linktext); }
.md-linkurl{ color:var(--linkurl); }
.src-line.heading .content{ color:var(--heading); font-weight:700; }

/* ── Preview pane ─────────────────────────────────────── */
#previewPane{
  background:var(--prev-bg);
  color:var(--prev-text);
  font-family:'Source Sans 3',sans-serif;
  font-size:14.5px;
  line-height:1.6;
  padding:40px 48px 56px;
}
#previewPane h1,#previewPane h2,#previewPane h3{
  font-family:'Source Serif 4',serif;
  color:var(--prev-heading);
  margin-top:26px;
  margin-bottom:10px;
}
#previewPane h1{ font-size:30px; margin-top:0; }
#previewPane h2{
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1.5px;
  border-bottom:1px solid var(--prev-rule);
  padding-bottom:6px;
  margin-top:32px;
}
#previewPane h3{ font-size:16px; font-weight:600; margin-top:20px; }
#previewPane p{ margin-bottom:10px; color:var(--prev-text); }
#previewPane p em{ color:var(--prev-muted); font-style:italic; }
#previewPane ul{ list-style:none; padding:0; margin-bottom:14px; }
#previewPane li{ position:relative; padding-left:16px; margin-bottom:5px; font-size:14px; }
#previewPane li::before{ content:"–"; position:absolute; left:0; color:var(--prev-muted); }
#previewPane a{ color:var(--prev-link); border-bottom:1px solid var(--prev-rule); text-decoration:none; }
#previewPane a:hover{ border-color:var(--prev-link); }
#previewPane strong{ font-weight:700; color:var(--prev-heading); }

.status{
  margin-top:14px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

.error-box{ color:var(--error); padding:20px 16px; }
.error-box a{ color:var(--accent); }

footer.page-footer{
  margin-top:22px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
footer.page-footer a{ color:var(--muted); }
footer.page-footer a:hover{ color:var(--accent); }
</style>
<style>
.ide-tabbar{position:sticky;top:0;z-index:99999;display:flex;align-items:stretch;background:#2d2d2d;border-bottom:1px solid #3a3a3a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ide-tabbar .dots{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 14px}
.ide-tabbar .dots span{width:10px;height:10px;border-radius:50%;display:inline-block}
.ide-tabbar .dots .r{background:#ff5f56}
.ide-tabbar .dots .y{background:#ffbd2e}
.ide-tabbar .dots .g{background:#27c93f}
.ide-tabbar .tabs{display:flex;overflow-x:auto;scrollbar-width:none;flex:1}
.ide-tabbar .tabs::-webkit-scrollbar{display:none}
.ide-tabbar .tab{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:10px 16px;font-size:12.5px;color:#8a8a8a;text-decoration:none;white-space:nowrap;border-right:1px solid #3a3a3a;border-top:2px solid transparent;transition:background .15s,color .15s}
.ide-tabbar .tab:hover{background:#333;color:#ddd}
.ide-tabbar .tab.active{background:#1e1e1e;color:#fff}
.ide-tabbar .tab .file-icon{font-weight:700;font-size:12px;display:inline-flex;align-items:center}
.ide-tabbar .tab .file-icon svg{display:block}
.ide-tabbar .tab .tab-close{margin-left:2px;opacity:0;color:#888;font-size:13px;transition:opacity .15s}
.ide-tabbar .tab:hover .tab-close{opacity:1}
.ide-tabbar .tab.type-basic .file-icon{color:#e37933}
.ide-tabbar .tab.type-basic.active{border-top-color:#e37933}
.ide-tabbar .tab.type-playstore .file-icon{color:#01875f}
.ide-tabbar .tab.type-playstore.active{border-top-color:#01875f}
.ide-tabbar .tab.type-json .file-icon{color:#e8c547}
.ide-tabbar .tab.type-json.active{border-top-color:#e8c547}
.ide-tabbar .tab.type-md .file-icon{color:#519aba}
.ide-tabbar .tab.type-md.active{border-top-color:#519aba}
@media print{.ide-tabbar{display:none}}
@media (max-width:600px){.ide-tabbar .tab{padding:9px 12px;font-size:12px}}
</style>
</head>
<body>
<div class="ide-tabbar">
  <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
  <div class="tabs">
    <a href="index.html" class="tab type-basic"><span class="file-icon">&lt;/&gt;</span>index.html<span class="tab-close">&times;</span></a>
    <a href="resume-markdown.html" class="tab type-md active"><span class="file-icon">M&darr;</span>resume.md<span class="tab-close">&times;</span></a>
    <a href="resume-json.html" class="tab type-json"><span class="file-icon">{ }</span>resume.json<span class="tab-close">&times;</span></a>
    <a href="resume-android.html" class="tab type-playstore"><span class="file-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zM20.5 8c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zM15.53 2.16l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/></svg></span>resume-android.apk<span class="tab-close">&times;</span></a>
  </div>
</div>
<script>
(function(){
  var tabs=document.querySelector('.ide-tabbar .tabs');
  var active=document.querySelector('.ide-tabbar .tab.active');
  if(tabs && active){
    var tabsRect=tabs.getBoundingClientRect();
    var activeRect=active.getBoundingClientRect();
    tabs.scrollLeft+=activeRect.left-tabsRect.left;
  }
})();
</script>
<div class="wrap">
  <div class="editor">
    <div class="toolbar">
      <div class="toolbar-actions">
        <div class="view-toggle">
          <button id="btnSource" type="button" class="active">Source</button>
          <button id="btnPreview" type="button">Preview</button>
        </div>
      </div>
      <a class="raw-link" href="resume.md">view raw →</a>
    </div>
    <div id="previewPane" class="pane"></div>
    <div id="sourcePane" class="pane active"></div>
  </div>
  <div class="status" id="status"></div>

</div>

<script>
(function(){
  var previewPane = document.getElementById('previewPane');
  var sourcePane = document.getElementById('sourcePane');
  var btnPreview = document.getElementById('btnPreview');
  var btnSource = document.getElementById('btnSource');
  var statusEl = document.getElementById('status');

  var INLINE_RE = /(\*\*(.+?)\*\*)|(\*(.+?)\*)|(\[([^\]]+)\]\(([^)]+)\))/g;

  function inlineFragment(text, forSource){
    var frag = document.createDocumentFragment();
    var lastIndex = 0, m;
    INLINE_RE.lastIndex = 0;
    while ((m = INLINE_RE.exec(text))){
      if (m.index > lastIndex){
        frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      }
      if (m[1] !== undefined){
        if (forSource){
          frag.appendChild(punct('**'));
          frag.appendChild(styled('md-bold', m[2]));
          frag.appendChild(punct('**'));
        } else {
          var strong = document.createElement('strong');
          strong.textContent = m[2];
          frag.appendChild(strong);
        }
      } else if (m[3] !== undefined){
        if (forSource){
          frag.appendChild(punct('*'));
          frag.appendChild(styled('md-italic', m[4]));
          frag.appendChild(punct('*'));
        } else {
          var em = document.createElement('em');
          em.textContent = m[4];
          frag.appendChild(em);
        }
      } else if (m[5] !== undefined){
        if (forSource){
          frag.appendChild(punct('['));
          frag.appendChild(styled('md-linktext', m[6]));
          frag.appendChild(punct(']('));
          frag.appendChild(styled('md-linkurl', m[7]));
          frag.appendChild(punct(')'));
        } else {
          var a = document.createElement('a');
          a.href = m[7];
          a.textContent = m[6];
          frag.appendChild(a);
        }
      }
      lastIndex = INLINE_RE.lastIndex;
    }
    if (lastIndex < text.length){
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
    return frag;
  }

  function punct(s){
    var span = document.createElement('span');
    span.className = 'md-punct';
    span.textContent = s;
    return span;
  }

  function styled(cls, text){
    var span = document.createElement('span');
    span.className = cls;
    span.textContent = text;
    return span;
  }

  function renderPreview(text){
    var lines = text.split('\n');
    var paragraphBuf = [];
    var listEl = null;

    function flushParagraph(){
      if (paragraphBuf.length){
        var p = document.createElement('p');
        p.appendChild(inlineFragment(paragraphBuf.join(' '), false));
        previewPane.appendChild(p);
        paragraphBuf = [];
      }
    }
    function flushList(){
      if (listEl){ previewPane.appendChild(listEl); listEl = null; }
    }

    lines.forEach(function(line){
      var headingMatch = /^(#{1,6})\s+(.*)$/.exec(line);
      var listMatch = /^-\s+(.*)$/.exec(line);
      if (headingMatch){
        flushParagraph(); flushList();
        var level = Math.min(headingMatch[1].length, 6);
        var h = document.createElement('h' + level);
        h.appendChild(inlineFragment(headingMatch[2], false));
        previewPane.appendChild(h);
      } else if (listMatch){
        flushParagraph();
        if (!listEl) listEl = document.createElement('ul');
        var li = document.createElement('li');
        li.appendChild(inlineFragment(listMatch[1], false));
        listEl.appendChild(li);
      } else if (line.trim() === ''){
        flushParagraph();
        flushList();
      } else {
        flushList();
        paragraphBuf.push(line.trim());
      }
    });
    flushParagraph();
    flushList();
  }

  function renderSource(text){
    var lines = text.split('\n');
    lines.forEach(function(line, idx){
      var row = document.createElement('div');
      row.className = 'src-line';

      var ln = document.createElement('span');
      ln.className = 'ln';
      ln.textContent = idx + 1;
      row.appendChild(ln);

      var content = document.createElement('span');
      content.className = 'content';

      var headingMatch = /^(#{1,6})(\s+)(.*)$/.exec(line);
      var listMatch = /^(-)(\s+)(.*)$/.exec(line);

      if (headingMatch){
        row.classList.add('heading');
        content.appendChild(punct(headingMatch[1] + headingMatch[2]));
        content.appendChild(inlineFragment(headingMatch[3], true));
      } else if (listMatch){
        content.appendChild(punct(listMatch[1] + listMatch[2]));
        content.appendChild(inlineFragment(listMatch[3], true));
      } else if (line.trim() === ''){
        content.innerHTML = '&nbsp;';
      } else {
        content.appendChild(inlineFragment(line, true));
      }

      row.appendChild(content);
      sourcePane.appendChild(row);
    });
  }

  function setView(view){
    var isPreview = view === 'preview';
    previewPane.classList.toggle('active', isPreview);
    sourcePane.classList.toggle('active', !isPreview);
    btnPreview.classList.toggle('active', isPreview);
    btnSource.classList.toggle('active', !isPreview);
  }

  btnPreview.addEventListener('click', function(){ setView('preview'); });
  btnSource.addEventListener('click', function(){ setView('source'); });

  fetch('resume.md')
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(text){
      renderPreview(text);
      renderSource(text);
      setView('source');
      var lineCount = text.split('\n').length;
      var wordCount = text.trim().split(/\s+/).length;
      statusEl.textContent = lineCount + ' lines · ' + wordCount + ' words · toggle Preview / Source above';
    })
    .catch(function(err){
      previewPane.innerHTML = '';
      previewPane.classList.add('active');
      var box = document.createElement('div');
      box.className = 'error-box';
      box.innerHTML = 'Couldn\'t load resume.md: ' + err.message + '<br>Try the <a href="resume.md">raw file</a> instead.';
      previewPane.appendChild(box);
    });
})();
</script>
</body>
</html>
